{% extends "base.html" %}
{% block title %}Criar Turma{% endblock %}
{% block content %}
    <h1>Criar Turma</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit">Salvar Turma</button>
        <a href="{% url 'listar_turmas' %}">Cancelar</a>
    </form>
{% endblock %}
