{% extends "base.html" %}
{% block title %}Editar Turma{% endblock %}
{% block content %}
    <h1>Editar Turma: {{ turma.nome }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit">Salvar Alterações</button>
        <a href="{% url 'listar_turmas' %}">Cancelar</a>
    </form>
{% endblock %}
