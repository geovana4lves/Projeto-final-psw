{% extends "base.html" %}
{% block content %}
    <h1>Excluir Matricula</h1>
    <p>Tem certeza que deseja excluir "<strong>{{ matricula.nome }}</strong>"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, Excluir</button>
        <a href="{% url 'listar_matriculas' %}">Cancelar</a>
    </form>
{% endblock %}
