{% extends "base.html" %}
{% block title %}Formulário de Professor{% endblock %}
{% block content %}
    <h1>{% if pessoa %}Editar Professor: {{ professor.nome }}{% else %}Criar Professor{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
        <a href="{% url 'listar_professores' %}">Cancelar</a>
    </form>
{% endblock %}
