{% extends "base.html" %}
{% block title %}Excluir Professor{% endblock %}
{% block content %}
    <h1>Excluir Professor</h1>
    <p>Tem certeza que deseja excluir o professor "<strong>{{ professor.nome }}</strong>"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, Excluir</button>
        <a href="{% url 'listar_professores' %}">Cancelar</a>
    </form>
{% endblock %}
