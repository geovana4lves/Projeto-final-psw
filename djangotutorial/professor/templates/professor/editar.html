{% extends "base.html" %}
{% block title %}Editar Professor{% endblock %}
{% block content %}
    <h1>Editar Professor: {{ professor.nome }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit">Salvar Alterações</button>
        <a href="{% url 'listar_professores' %}">Cancelar</a>
    </form>
{% endblock %}
