{% extends "base.html" %}
{% block title %}Editar Aluno{% endblock %}
{% block content %}
    <h1>Editar Pessoa: {{ pessoa.nome }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit">Salvar Alterações</button>
        <a href="{% url 'listar_pessoas' %}">Cancelar</a>
    </form>
{% endblock %}
