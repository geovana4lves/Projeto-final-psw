{% extends "base.html" %}
{% block title %}Formulário de Aluno{% endblock %}
{% block content %}
    <h1>{% if pessoa %}Editar Aluno(a): {{ pessoa.nome }}{% else %}Criar Aluno(a){% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
        <a href="{% url 'listar_pessoas' %}">Cancelar</a>
    </form>
{% endblock %}
