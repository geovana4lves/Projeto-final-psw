{% extends "base.html" %}
{% block title %}Editar Curso{% endblock %}
{% block content %}
    <h1>Editar Curso: {{ curso.nome }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit">Salvar Alterações</button>
        <a href="{% url 'listar_cursos' %}">Cancelar</a>
    </form>
{% endblock %}
