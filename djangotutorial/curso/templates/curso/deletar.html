{% extends "base.html" %}
{% block title %}Excluir Curso{% endblock %}
{% block content %}
    <h1>Excluir Curso</h1>
    <p>Tem certeza que deseja excluir o curso "<strong>{{ curso.nome }}</strong>"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, Excluir</button>
        <a href="{% url 'listar_cursos' %}">Cancelar</a>
    </form>
{% endblock %}
