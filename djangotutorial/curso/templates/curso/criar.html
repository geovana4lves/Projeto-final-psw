{% extends "base.html" %}
{% block title %}Formulário de Curso{% endblock %}
{% block content %}
    <h1>{% if curso %}Editar Curso: {{ curso.nome }}{% else %}Criar Curso{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
        <a href="{% url 'listar_cursos' %}">Cancelar</a>
    </form>
{% endblock %}
